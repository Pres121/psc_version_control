<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSC App Update Manager — Releases</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Slide Menu Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="brand-text">PSC <span>Manager</span></div>
      </a>
      <button class="close-btn" id="close-sidebar" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Main Menu</div>
      
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Overview</span>
      </a>

      <a href="applications.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/></svg>
        <span>Applications</span>
      </a>

      <a href="releases.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Releases</span>
      </a>

      <a href="notifications.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Notifications</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="sidebar-user-avatar">A</div>
        <div class="user-details">
          <span class="user-name" id="sidebar-user-name">Admin User</span>
          <span class="user-role" id="sidebar-user-email">admin@psc.com</span>
        </div>
      </div>
      <button id="logout" class="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- App Wrapper -->
  <div class="app-wrapper">
    <!-- Topbar Header -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation drawer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-header">
          <h1>Release Management</h1>
        </div>
      </div>

      <div class="topbar-right">
        <div class="system-status">
          <span class="pulse-dot"></span> Version Pipeline
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="card">
        <h3>Create New Release (Draft)</h3>
        <form id="release-form">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
            <div class="form-group">
              <label for="application_id">Target Application</label>
              <select id="application_id" required></select>
            </div>

            <div class="form-group">
              <label for="platform">Platform</label>
              <select id="platform">
                <option value="android">Android</option>
                <option value="ios">iOS</option>
              </select>
            </div>

            <div class="form-group">
              <label for="version">Version Number</label>
              <input id="version" required placeholder="1.4.0" />
            </div>

            <div class="form-group">
              <label for="build_number">Build Number</label>
              <input id="build_number" type="number" required placeholder="14" />
            </div>
          </div>

          <div class="form-group">
            <label for="release_title">Release Title</label>
            <input id="release_title" placeholder="Major Performance & Security Update" />
          </div>

          <div class="form-group">
            <label for="release_notes">Release Notes (one per line)</label>
            <textarea id="release_notes" rows="3" placeholder="Added dark mode support&#10;Enhanced network sync reliability&#10;Fixed rare crash on startup"></textarea>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
            <div class="form-group">
              <label for="minimum_supported_version">Minimum Supported Version</label>
              <input id="minimum_supported_version" required placeholder="1.2.0" />
            </div>

            <div class="form-group">
              <label for="update_url">Update Store URL</label>
              <input id="update_url" required placeholder="https://play.google.com/store/apps/details?id=..." />
            </div>
          </div>

          <div class="form-group" style="margin-top: 4px;">
            <label class="checkbox-label">
              <input type="checkbox" id="is_mandatory" />
              <span>Flag as Mandatory Update (Force client upgrade)</span>
            </label>
          </div>

          <div class="error" id="error" style="display:none"></div>

          <div style="margin-top: 6px;">
            <button class="primary" type="submit">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Create Draft Release
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <h3>Release History</h3>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>App</th>
                <th>Platform</th>
                <th>Version</th>
                <th>Build</th>
                <th>Status</th>
                <th>Type</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="releases-table">
              <tr><td colspan="7" style="text-align:center; padding: 24px;">Loading releases history…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/releases.js"></script>
</body>
</html>
