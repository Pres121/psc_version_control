<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PSC App Update Manager — Login</title>
<link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <img class="login-logo" src="assets/psc-logo.png" alt="PSC" />
        <h2>PSC Update Hub</h2>
        <p id="login-subtitle">Sign in with email and password</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="pscecosystem@gmail.com" autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••••••" autocomplete="current-password" />
        </div>

        <div class="error" id="error" style="display:none"></div>

        <div style="margin-top: 8px;">
          <button class="primary" type="submit" style="width:100%; justify-content:center; padding: 12px;">
            Continue
          </button>
        </div>
      </form>

      <form id="otp-form" style="display:none">
        <div class="form-group">
          <label for="otp">Email verification code</label>
          <input type="text" id="otp" inputmode="numeric" pattern="[0-9]*" maxlength="8" required placeholder="6-digit code" autocomplete="one-time-code" />
          <p class="field-hint">Check your inbox for the code we just sent.</p>
        </div>

        <div class="error" id="otp-error" style="display:none"></div>

        <div style="display:flex; gap:10px; margin-top: 8px;">
          <button class="secondary" type="button" id="back-to-login" style="flex:1;">Back</button>
          <button class="primary" type="submit" style="flex:1;">Verify &amp; Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js?v=9"></script>
  <script>
    let challengeToken = null;

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";
      try {
        const result = await Api.login(email, password);
        if (!result.otp_required || !result.challenge_token) {
          throw new Error("Unexpected login response from server");
        }
        challengeToken = result.challenge_token;
        sessionStorage.setItem("psc_otp_challenge", challengeToken);
        document.getElementById("login-form").style.display = "none";
        document.getElementById("otp-form").style.display = "block";
        document.getElementById("login-subtitle").textContent = result.message || "Enter the code sent to your email";
        document.getElementById("otp").focus();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    });

    document.getElementById("otp-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const otp = document.getElementById("otp").value.trim();
      const errorEl = document.getElementById("otp-error");
      errorEl.style.display = "none";
      const token = challengeToken || sessionStorage.getItem("psc_otp_challenge");
      try {
        const { access_token } = await Api.verifyOtp(token, otp);
        setToken(access_token);
        sessionStorage.removeItem("psc_otp_challenge");
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      }
    });

    document.getElementById("back-to-login").addEventListener("click", () => {
      challengeToken = null;
      sessionStorage.removeItem("psc_otp_challenge");
      document.getElementById("otp-form").style.display = "none";
      document.getElementById("login-form").style.display = "block";
      document.getElementById("login-subtitle").textContent = "Sign in with email and password";
      document.getElementById("otp").value = "";
      document.getElementById("otp-error").style.display = "none";
    });
  </script>
</body>
</html>
